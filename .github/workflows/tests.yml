name: Tests and smoke examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Numerical and reproduction checks
        run: python -m pytest -q
      - name: Smoke examples and verified reuse
        run: |
          python code/reproduce.py --smoke
          python code/reproduce.py --smoke --resume
      - name: Inline notebook figures (smoke)
        run: python code/check_notebooks.py --mode smoke
